parameters:
    upload_directory: '%kernel.project_dir%/public/uploads'
    chat_uploads_directory: '%kernel.project_dir%/var/chat_uploads'
    app.smtp_from: '%env(SMTP_FROM)%'
    app.frontend_url: '%env(FRONTEND_URL)%'
    app.admin_email: '%env(ADMIN_EMAIL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\Service\:
        resource: '../src/Service/'

    App\Repository\:
        resource: '../src/Repository/'

    App\EventListener\:
        resource: '../src/EventListener/'
        tags: ['kernel.event_listener']

    App\MessageHandler\:
        resource: '../src/MessageHandler/'
        tags: ['messenger.message_handler']

    App\Service\FileUploadService:
        arguments:
            $chatUploadsDirectory: '%chat_uploads_directory%'
